<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>MealMind · 美食外卖</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ---------- 美食外卖页专属（仅使用契约 token 与既有类） ---------- */
    .foods-top { background: var(--c-surface); }
    .foods-search { padding: 2px 12px 12px; }

    .voucher-sec { padding: 2px 0 12px; }
    .voucher-sec .voucher-row { padding-top: 2px; }
    .voucher .v-btn {
      display: inline-block; margin-top: 8px; padding: 3px 12px;
      border-radius: 999px; background: var(--grad-cta);
      color: var(--c-surface); font-size: 11px; font-weight: 600;
    }

    .foods-top .chips-row { padding-bottom: 12px; }

    .sortbar {
      display: flex; align-items: center; gap: 18px;
      padding: 11px 14px; background: var(--c-surface);
      border-top: 1px solid var(--c-border);
    }
    .sort {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 13px; color: var(--c-text-sub); white-space: nowrap;
    }
    .sort.on { color: var(--c-text); font-weight: 600; }
    .sort svg { width: 13px; height: 13px; }

    /* 商家卡：--dishes 变体在既有 .mcard 基础上纵向排布，底部追加菜品预览条 */
    .mcard--dishes { flex-direction: column; gap: 0; }
    .mcard-top { display: flex; gap: 10px; }
    .mcard-deal { font-size: 11px; color: var(--c-text-ter); }

    .list-end { padding: 10px 0 2px; text-align: center; font-size: 11px; color: var(--c-text-ter); }
  </style>
</head>
<body data-page="foods">
<div class="app">

  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="statusbar-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="4.5" y="5" width="3" height="6" rx="0.8"/><rect x="9" y="2.6" width="3" height="8.4" rx="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.8"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.6 6.2 8.7a2.6 2.6 0 0 1 3.6 0L8 10.6z"/><path d="M8 6.6c1.2 0 2.3.45 3.1 1.2l1.2-1.25A6.4 6.4 0 0 0 8 4.8a6.4 6.4 0 0 0-4.3 1.75L4.9 7.8A4.5 4.5 0 0 1 8 6.6z"/><path d="M8 2.8c2.1 0 4 .8 5.5 2.1l1.2-1.25A9.3 9.3 0 0 0 8 1 9.3 9.3 0 0 0 1.3 3.65L2.5 4.9A7.4 7.4 0 0 1 8 2.8z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="screen">

    <!-- ① 页头 -->
    <div class="page-head">
      <a class="back" href="home.html" aria-label="返回首页">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <span class="title">美食外卖</span>
      <div class="head-actions">
        <button class="js-placeholder" data-toast="演示版本未开放「消息」" type="button" aria-label="消息">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4.1 16L2.2 22l5.7-2z"/></svg>
        </button>
        <button class="js-placeholder" data-toast="演示版本未开放「更多」" type="button" aria-label="更多">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </div>

    <div class="foods-top">
      <!-- ② 搜索栏 -->
      <div class="foods-search">
        <div class="searchbar">
          <span class="scan">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V5.4A2.4 2.4 0 0 1 5.4 3h2.1"/><path d="M16.5 3h2.1A2.4 2.4 0 0 1 21 5.4v2.1"/><path d="M21 16.5v2.1a2.4 2.4 0 0 1-2.4 2.4h-2.1"/><path d="M7.5 21H5.4A2.4 2.4 0 0 1 3 18.6v-2.1"/><path d="M7 12h10"/></svg>
          </span>
          <input id="foodsSearch" type="text" placeholder="大家都在搜：麻辣烫" aria-label="搜索商家、菜品">
          <button class="btn-search js-placeholder" data-toast="演示版本暂未开放搜索功能" type="button">搜索</button>
        </div>
      </div>

      <!-- ③ 红包区 -->
      <div class="voucher-sec">
        <div class="sec-head">
          <h3 class="sec-title">夜市红包天天领</h3>
          <span class="sec-more">每晚 8 点</span>
        </div>
        <div class="voucher-row" id="voucherRow"></div>
      </div>

      <!-- ④ 品类快捷条 -->
      <div class="chips-row hscroll">
        <button class="chip js-placeholder" data-toast="演示版本仅开放「美食外卖」" type="button">夜宵精选</button>
        <button class="chip js-placeholder" data-toast="演示版本仅开放「美食外卖」" type="button">龙虾烧烤</button>
        <button class="chip js-placeholder" data-toast="演示版本仅开放「美食外卖」" type="button">奶茶果汁</button>
        <button class="chip js-placeholder" data-toast="演示版本仅开放「美食外卖」" type="button">炸鸡串串</button>
        <button class="chip js-placeholder" data-toast="演示版本仅开放「美食外卖」" type="button">鸭脖卤味</button>
        <button class="chip js-placeholder" data-toast="演示版本仅开放「美食外卖」" type="button">特色小吃</button>
        <button class="chip on" type="button">全部</button>
      </div>

      <!-- ⑤ 排序条 -->
      <div class="sortbar hscroll">
        <button class="sort on" type="button">综合排序
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg>
        </button>
        <button class="sort js-placeholder" data-toast="演示版本仅展示「综合排序」" type="button">天天爆红包</button>
        <button class="sort js-placeholder" data-toast="演示版本仅展示「综合排序」" type="button">堂食店</button>
        <button class="sort js-placeholder" data-toast="演示版本仅展示「综合排序」" type="button">15 分钟</button>
        <button class="sort js-placeholder" data-toast="演示版本仅展示「综合排序」" type="button">减配送费</button>
        <button class="sort js-placeholder" data-toast="演示版本暂未开放筛选" type="button">筛选
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg>
        </button>
      </div>
    </div>

    <!-- ⑥ 商家列表（先骨架屏，再渲染） -->
    <div id="foodsList"></div>

    <!-- ⑦ 列表末尾 -->
    <p class="list-end">没有更多了</p>
    <p class="app-footer-note">模拟数据 · 仅用于产品演示</p>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <a class="tab" data-nav="home" href="home.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2"/><path d="M5.2 9.6V21h13.6V9.6"/><path d="M9.8 21v-5.6h4.4V21"/></svg>
      <span>推荐</span>
    </a>
    <a class="tab js-placeholder" data-toast="演示版本未开放「消息」" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4.1 16L2.2 22l5.7-2z"/></svg>
      <span>消息</span><i class="tab-dot"></i>
    </a>
    <a class="tab tab-ai" data-nav="agent" href="agent.html">
      <span class="tab-ai-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l1.7 5a2 2 0 0 0 1.2 1.2l5 1.7-5 1.7a2 2 0 0 0-1.2 1.2l-1.7 5-1.7-5a2 2 0 0 0-1.2-1.2l-5-1.7 5-1.7a2 2 0 0 0 1.2-1.2l1.7-5z"/><path d="M19 2.8v3.4"/><path d="M20.7 4.5h-3.4"/></svg>
      </span>
      <span>AI 点外卖</span>
    </a>
    <a class="tab" data-nav="cart" href="cart.html">
      <span class="tab-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.6 3h2.2l2.3 11.1a1.8 1.8 0 0 0 1.8 1.4h8.4a1.8 1.8 0 0 0 1.8-1.4L20.7 7H5.4"/></svg>
        <i class="tab-badge" data-cart-badge hidden>0</i>
      </span>
      <span>购物车</span>
    </a>
    <a class="tab" data-nav="mine" href="mine.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.6" r="3.6"/><path d="M5 20.2a7 7 0 0 1 14 0"/></svg>
      <span>我的</span>
    </a>
  </nav>
</div>

<script src="mock.js"></script>
<script src="state.js"></script>
<script src="api.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script>
  /* ---------- 搜索占位符（数据来自 DB） ---------- */
  document.getElementById('foodsSearch').placeholder = window.DB.searchHint;

  /* ---------- ③ 红包券：3 张来自 DB.coupons ---------- */
  (function () {
    var row = document.getElementById('voucherRow');
    row.innerHTML = window.DB.coupons.map(function (c) {
      return '<div class="voucher">' +
        '<div class="v-amt"><small>¥</small>' + c.amt + '</div>' +
        '<div class="v-sub">' + c.label + ' · ' + c.cond + '</div>' +
        '<button class="v-btn js-placeholder" data-toast="演示版本仅展示，不提供领取" type="button">一键领取</button>' +
      '</div>';
    }).join('');
  })();

  /* ---------- ⑥ 商家列表：先骨架屏，再渲染 ---------- */
  (function () {
    var list = document.getElementById('foodsList');

    function renderSkeleton() {
      var html = '';
      for (var i = 0; i < 3; i++) {
        html += '<div class="sk-card"><div class="sk sk-img"></div><div class="sk-lines">' +
          '<div class="sk sk-line w60"></div><div class="sk sk-line w40"></div><div class="sk sk-line w80"></div>' +
          '</div></div>';
      }
      list.innerHTML = html;
    }

    function tagHtml(m) {
      var out = '';
      if (m.rank) out += '<i class="tag tag-orange">' + m.rank + '</i>';
      m.promoTags.slice(0, 2).forEach(function (t) { out += '<i class="tag tag-red">' + t + '</i>'; });
      m.feastTags.slice(0, 2).forEach(function (t) { out += '<i class="tag tag-gray">' + t + '</i>'; });
      return out;
    }

    function dishStrip(m) {
      return '<span class="disc-strip">' + m.dishes.slice(0, 3).map(function (d) {
        return '<span class="disc">' +
          '<img src="' + window.DB.dishImg(d.n) + '" alt="' + d.n + '">' +
          '<span class="dn">' + d.n + '</span>' +
          '<span class="dp">' + d.p + '</span>' +
        '</span>';
      }).join('') + '</span>';
    }

    function renderCard(m) {
      return '<a class="mcard mcard--dishes" href="merchant.html?id=' + m.id + '">' +
        '<span class="mcard-top">' +
          '<span class="mcard-imgwrap">' +
            '<img class="mcard-img" src="' + m.img + '" alt="' + m.name + '">' +
            (m.badge ? '<i class="mcard-badge">' + m.badge + '</i>' : '') +
          '</span>' +
          '<span class="mcard-main">' +
            '<span class="mcard-name">' + m.name + '</span>' +
            '<span class="mcard-meta"><b class="rate">' + m.rating + '</b><span class="dot">·</span>' +
              '<span>' + m.sales + '</span><span class="dot">·</span>' +
              '<span>' + m.mins + ' 分钟</span><span class="dot">·</span><span>' + m.km + '</span></span>' +
            '<span class="mcard-deal">' + m.minText + ' · ' + m.feeText + '</span>' +
            '<span class="mcard-tags">' + tagHtml(m) + '</span>' +
          '</span>' +
        '</span>' +
        dishStrip(m) +
      '</a>';
    }

    renderSkeleton();
    API.fetchFoodsMerchants().then(function (res) {
      list.innerHTML = res.data.map(renderCard).join('');
    });
  })();
</script>
</body>
</html>
