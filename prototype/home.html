<script src="mock.js"></script>
<script src="state.js"></script>
<script src="api.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script>
  /* ---------- 分类宫格：仅「美食外卖」可点，其余统一轻提示 ---------- */
  (function () {
    var grid = document.getElementById('catGrid');
    var html = '';
    window.DB.categories.forEach(function (c) {
      var inner = '<span class="cat-tile" style="--tint:' + c.tint + ';--ink:' + c.ink + '">' +
        icon(c.icon, 23) + '</span><span>' + c.name + '</span>';
      if (c.real) {
        html += '<a class="cat" href="foods.html">' + inner + '</a>';
      } else {
        html += '<button class="cat js-placeholder" type="button" data-toast="演示版本仅开放「美食外卖」">' + inner + '</button>';
      }
    });
    grid.innerHTML = html;
  })();

  /* ---------- 推荐商家：先骨架屏，再渲染（展示加载状态） ---------- */
  (function () {
    var list = document.getElementById('merchantList');

    function renderSkeleton() {
      var html = '';
      for (var i = 0; i < 3; i++) {
        html += '<div class="sk-card"><div class="sk sk-img"></div><div class="sk-lines">' +
          '<div class="sk sk-line w60"></div><div class="sk sk-line w40"></div><div class="sk sk-line w80"></div>' +
          '</div></div>';
      }
      list.innerHTML = html;
    }

    function renderCard(m) {
      var promo = m.promoTags.slice(0, 2).map(function (t) { return '<i class="tag tag-red">' + t + '</i>'; }).join('');
      var feast = m.feastTags.slice(0, 2).map(function (t) { return '<i class="tag tag-gray">' + t + '</i>'; }).join('');
      return '<a class="mcard" href="merchant.html?id=' + m.id + '">' +
        '<span class="mcard-imgwrap">' +
          '<img class="mcard-img" src="' + m.img + '" alt="' + m.name + '">' +
          (m.badge ? '<i class="mcard-badge">' + m.badge + '</i>' : '') +
        '</span>' +
        '<span class="mcard-main">' +
          '<span class="mcard-name">' + m.name + '</span>' +
          '<span class="mcard-meta"><b class="rate">' + m.rating + '</b><span class="dot">·</span>' +
            '<span>' + m.sales + '</span><span class="dot">·</span>' +
            '<span>' + m.mins + ' 分钟</span><span class="dot">·</span><span>' + m.km + '</span></span>' +
          '<span class="mcard-tags">' + promo + feast + '</span>' +
        '</span></a>';
    }

    renderSkeleton();
    API.fetchHomeMerchants().then(function (res) {
      list.innerHTML = res.data.map(renderCard).join('');
    });
  })();
</script>
