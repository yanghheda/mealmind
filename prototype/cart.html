<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>MealMind · 购物车</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ---------- 购物车页专属（仅使用契约 token 与既有类） ---------- */
    .cart-screen { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }

    .cart-loc { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--c-text-sub); }
    .cart-loc svg { width: 13px; height: 13px; }
    .cart-loc .chev { width: 12px; height: 12px; }
    .cart-manage { font-size: 13px; color: var(--c-text); }

    .cart-list { display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 0; }

    .cart-ghead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px; }
    .cart-gname { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; }
    .cart-gname svg { flex: none; width: 13px; height: 13px; color: var(--c-text-ter); }
    .cart-gtext { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .cart-gtime { flex: none; font-size: 12px; color: var(--c-text-ter); }
    .cart-gdel { flex: none; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--c-text-ter); }
    .cart-gdel svg { width: 16px; height: 16px; }

    .cart-gitems { padding: 0 12px; }
    .cart-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--c-border); }
    .cart-item:first-child { border-top: 0; }
    .cart-thumb { flex: none; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #F2F3F5; }
    .cart-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .cart-iname { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .cart-ispec { font-size: 11px; color: var(--c-text-ter); }
    .cart-ibottom { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .cart-iprice { font-size: 15px; }
    .cart-idel { flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--c-text-ter); }
    .cart-idel svg { width: 18px; height: 18px; }

    .pick { flex: none; display: flex; align-items: center; justify-content: center; color: var(--c-text-ter); }
    .pick.on { color: var(--c-primary); }

    .empty-title { font-size: 15px; font-weight: 600; color: var(--c-text); }
    .empty-acts { display: flex; gap: 10px; }

    .cartbar {
      position: fixed; z-index: 60;
      left: 50%; bottom: calc(56px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: 100%; max-width: 414px;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, .98);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--c-border);
    }
    .cartbar[hidden] { display: none; }
    .cartbar-all { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-text-sub); }
    .cartbar-sum { display: inline-flex; align-items: baseline; gap: 4px; margin-left: auto; }
    .cartbar-slabel { font-size: 12px; color: var(--c-text-sub); }
    .cartbar-total { font-size: 18px; }
    .cartbar-cta { height: 44px; padding: 0 22px; font-size: 15px; }
  </style>
</head>
<body data-page="cart">
<div class="app">

  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="statusbar-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="4.5" y="5" width="3" height="6" rx="0.8"/><rect x="9" y="2.6" width="3" height="8.4" rx="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.8"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.6 6.2 8.7a2.6 2.6 0 0 1 3.6 0L8 10.6z"/><path d="M8 6.6c1.2 0 2.3.45 3.1 1.2l1.2-1.25A6.4 6.4 0 0 0 8 4.8a6.4 6.4 0 0 0-4.3 1.75L4.9 7.8A4.5 4.5 0 0 1 8 6.6z"/><path d="M8 2.8c2.1 0 4 .8 5.5 2.1l1.2-1.25A9.3 9.3 0 0 0 8 1 9.3 9.3 0 0 0 1.3 3.65L2.5 4.9A7.4 7.4 0 0 1 8 2.8z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <main class="screen cart-screen">

    <!-- ① 页头 -->
    <div class="page-head">
      <span class="title">购物车</span>
      <button class="cart-loc js-placeholder" data-toast="演示版本暂不支持切换收货地址" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.4c0 5.4-8 10.6-8 10.6s-8-5.2-8-10.6a8 8 0 0 1 16 0z"/><circle cx="12" cy="10.2" r="2.6"/></svg>
        <span id="cartLocName">星海中心 · B 座</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg>
      </button>
      <div class="head-actions">
        <button class="cart-manage" id="manageBtn" type="button">管理</button>
      </div>
    </div>

    <!-- ②③④ 内容区（分组列表 / 空态，由 JS 渲染） -->
    <div id="cartList" class="cart-list"></div>

    <p class="app-footer-note">模拟数据 · 仅用于产品演示</p>
  </main>

  <!-- ③ 底部固定结算栏 -->
  <div class="cartbar" id="cartBar" hidden>
    <button class="cartbar-all" id="selectAllBtn" type="button">
      <span class="pick" id="allPick"></span>
      <span>全选</span>
    </button>
    <div class="cartbar-sum">
      <span class="cartbar-slabel">合计</span>
      <b class="price cartbar-total" id="cartTotal">¥0</b>
    </div>
    <button class="btn btn-grad cartbar-cta js-placeholder" data-toast="演示版本至加购为止，不含结算" type="button">一键结算</button>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <a class="tab" data-nav="home" href="home.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2"/><path d="M5.2 9.6V21h13.6V9.6"/><path d="M9.8 21v-5.6h4.4V21"/></svg>
      <span>推荐</span>
    </a>
    <a class="tab js-placeholder" data-toast="演示版本未开放「消息」" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4.1 16L2.2 22l5.7-2z"/></svg>
      <span>消息</span><i class="tab-dot"></i>
    </a>
    <a class="tab tab-ai" data-nav="agent" href="agent.html">
      <span class="tab-ai-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l1.7 5a2 2 0 0 0 1.2 1.2l5 1.7-5 1.7a2 2 0 0 0-1.2 1.2l-1.7 5-1.7-5a2 2 0 0 0-1.2-1.2l-5-1.7 5-1.7a2 2 0 0 0 1.2-1.2l1.7-5z"/><path d="M19 2.8v3.4"/><path d="M20.7 4.5h-3.4"/></svg>
      </span>
      <span>AI 点外卖</span>
    </a>
    <a class="tab" data-nav="cart" href="cart.html">
      <span class="tab-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.6 3h2.2l2.3 11.1a1.8 1.8 0 0 0 1.8 1.4h8.4a1.8 1.8 0 0 0 1.8-1.4L20.7 7H5.4"/></svg>
        <i class="tab-badge" data-cart-badge hidden>0</i>
      </span>
      <span>购物车</span>
    </a>
    <a class="tab" data-nav="mine" href="mine.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.6" r="3.6"/><path d="M5 20.2a7 7 0 0 1 14 0"/></svg>
      <span>我的</span>
    </a>
  </nav>
</div>

<script src="mock.js"></script>
<script src="state.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    var listEl = document.getElementById('cartList');
    var barEl = document.getElementById('cartBar');
    var allPickEl = document.getElementById('allPick');
    var totalEl = document.getElementById('cartTotal');
    var manageBtn = document.getElementById('manageBtn');
    var selectAllBtn = document.getElementById('selectAllBtn');

    var manage = false;
    var selected = {};

    function keyOf(it) { return it.dishId + '|' + it.spec; }
    function parseKey(k) { var i = k.indexOf('|'); return { dishId: k.slice(0, i), spec: k.slice(i + 1) }; }
    function fmt(n) { return String(Math.round(n * 100) / 100); }

    function pickSvg(on) {
      return on
        ? '<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.4 12.4 3.1 3.1 6.1-6.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.4"/></svg>';
    }

    /* 选中态：新条目默认勾选，移除的条目清理 */
    function syncSelected() {
      var valid = {};
      Store.cart.forEach(function (it) {
        var k = keyOf(it);
        valid[k] = true;
        if (!(k in selected)) selected[k] = true;
      });
      Object.keys(selected).forEach(function (k) { if (!valid[k]) delete selected[k]; });
    }

    function groups() {
      var out = [], map = {};
      Store.cart.forEach(function (it) {
        if (!map[it.merchantId]) {
          map[it.merchantId] = { id: it.merchantId, name: it.merchantName, items: [] };
          out.push(map[it.merchantId]);
        }
        map[it.merchantId].items.push(it);
      });
      return out;
    }

    function itemHtml(it) {
      var k = keyOf(it);
      var on = !!selected[k];
      var img = it.img || window.DB.dishImg(it.name);
      return '<div class="cart-item">' +
        '<button class="pick' + (on ? ' on' : '') + '" data-pick="' + k + '" type="button" aria-label="选择商品">' + pickSvg(on) + '</button>' +
        '<img class="cart-thumb" src="' + img + '" alt="' + it.name + '">' +
        '<div class="cart-info">' +
          '<div class="cart-iname">' + it.name + '</div>' +
          '<div class="cart-ispec">' + it.spec + '</div>' +
          '<div class="cart-ibottom">' +
            '<span class="price cart-iprice">¥' + fmt(it.price) + '</span>' +
            '<span class="stepper">' +
              '<button class="minus" data-step="-1" data-key="' + k + '" type="button" aria-label="减少">' + icon('minus', 14) + '</button>' +
              '<span class="num">' + it.qty + '</span>' +
              '<button class="plus" data-step="1" data-key="' + k + '" type="button" aria-label="增加">' + icon('plus', 14) + '</button>' +
            '</span>' +
          '</div>' +
        '</div>' +
        (manage ? '<button class="cart-idel" data-delitem="' + k + '" type="button" aria-label="删除商品">' + icon('trash-2', 18) + '</button>' : '') +
      '</div>';
    }

    function groupHtml(g) {
      var m = window.DB.getMerchant(g.id);
      return '<section class="card">' +
        '<div class="cart-ghead">' +
          '<a class="cart-gname" href="merchant.html?id=' + g.id + '">' +
            '<span class="cart-gtext">' + g.name + '</span>' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></svg>' +
          '</a>' +
          '<span class="cart-gtime">' + m.mins + ' 分钟</span>' +
          '<button class="cart-gdel" data-delgroup="' + g.id + '" type="button" aria-label="删除该商家全部商品">' + icon('trash-2', 16) + '</button>' +
        '</div>' +
        '<div class="cart-gitems">' + g.items.map(itemHtml).join('') + '</div>' +
      '</section>';
    }

    function total() {
      return Store.cart.reduce(function (s, it) {
        return selected[keyOf(it)] ? s + it.price * it.qty : s;
      }, 0);
    }

    function allOn() {
      return Store.cart.length > 0 && Store.cart.every(function (it) { return selected[keyOf(it)]; });
    }

    function render() {
      syncSelected();

      if (!Store.cart.length) {
        listEl.innerHTML =
          '<div class="empty">' + icon('shopping-cart', 40) +
            '<p class="empty-title">购物车还是空的</p>' +
            '<div class="empty-acts">' +
              '<a class="btn btn-outline btn-sm" href="agent.html">去 AI 决策</a>' +
              '<button class="btn btn-grad btn-sm" id="seedBtn" type="button">载入演示购物车</button>' +
            '</div>' +
          '</div>';
        barEl.hidden = true;
        return;
      }

      listEl.innerHTML = groups().map(groupHtml).join('');
      barEl.hidden = false;
      allPickEl.classList.toggle('on', allOn());
      allPickEl.innerHTML = pickSvg(allOn());
      totalEl.textContent = '¥' + fmt(total());
    }

    /* ---------- 交互：条目区（事件委托） ---------- */
    listEl.addEventListener('click', function (e) {
      var t = e.target;

      if (t.closest('#seedBtn')) { Store.loadSeed(); showToast('已载入演示购物车'); return; }

      var pick = t.closest('[data-pick]');
      if (pick) {
        var pk = pick.getAttribute('data-pick');
        selected[pk] = !selected[pk];
        render();
        return;
      }

      var stepBtn = t.closest('[data-step]');
      if (stepBtn) {
        var k = stepBtn.getAttribute('data-key');
        var step = Number(stepBtn.getAttribute('data-step'));
        var p = parseKey(k);
        var cur = 0;
        Store.cart.forEach(function (it) { if (keyOf(it) === k) cur = it.qty; });
        Store.setQty(p.dishId, p.spec, cur + step); // 触发 cart:change → 重渲染
        return;
      }

      var delItem = t.closest('[data-delitem]');
      if (delItem) {
        var dk = parseKey(delItem.getAttribute('data-delitem'));
        Store.setQty(dk.dishId, dk.spec, 0);
        showToast('已移除该商品');
        return;
      }

      var delGroup = t.closest('[data-delgroup]');
      if (delGroup) {
        var gid = delGroup.getAttribute('data-delgroup');
        Store.cart = Store.cart.filter(function (it) { return it.merchantId !== gid; });
        Store.saveCart();
        showToast('已清空该商家商品');
      }
    });

    /* ---------- 交互：管理态 ---------- */
    manageBtn.addEventListener('click', function () {
      manage = !manage;
      manageBtn.textContent = manage ? '完成' : '管理';
      render();
    });

    /* ---------- 交互：全选 ---------- */
    selectAllBtn.addEventListener('click', function () {
      var next = !allOn();
      Store.cart.forEach(function (it) { selected[keyOf(it)] = next; });
      render();
    });

    /* ---------- 数据变动统一重渲染 ---------- */
    document.addEventListener('cart:change', render);

    document.getElementById('cartLocName').textContent = window.DB.location;
    render();
  })();
</script>
</body>
</html>
