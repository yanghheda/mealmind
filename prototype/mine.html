<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF4EC">
  <title>MealMind · 我的</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ---------- 页面：我的 ---------- */
    .mine-top {
      background: linear-gradient(180deg, #FFF4EC 0%, #FFF9F5 58%, #FFFDFB 100%);
      padding: 8px 16px 18px;
    }
    .profile { display: flex; align-items: center; gap: 12px; }
    .avatar {
      position: relative; flex: none;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--grad-ai); color: #fff;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid #fff; box-shadow: var(--shadow-float);
    }
    .avatar > svg { width: 26px; height: 26px; }
    .avatar-spark {
      position: absolute; right: -3px; bottom: -3px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; color: var(--c-primary);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(255, 80, 0, .28);
    }
    .avatar-spark svg { width: 12px; height: 12px; }
    .profile-main { min-width: 0; }
    .profile-name { font-size: 18px; font-weight: 700; }
    .profile-sub { margin-top: 3px; font-size: 11.5px; color: var(--c-text-sub); }

    /* 卡片标题（本页复用） */
    .card-head { display: flex; flex-direction: column; gap: 2px; }
    .card-title { font-size: 15px; font-weight: 700; }
    .card-sub { font-size: 11px; color: var(--c-text-ter); }

    /* 偏好记忆卡 */
    .prefs-card { margin: 0 12px; padding: 14px 14px 12px; }
    .prefs-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .prefs-empty { font-size: 12px; color: var(--c-text-ter); }
    .pref-chip {
      border-color: rgba(255, 80, 0, .25);
      background: var(--c-pink-tint); color: var(--c-primary); font-weight: 600;
    }
    .pref-chip:active { opacity: .65; }
    .pref-chip svg { opacity: .7; }
    .add-pref {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      width: 100%; height: 34px; margin-top: 12px;
      border: 1px dashed rgba(255, 80, 0, .35); border-radius: var(--radius-sm);
      background: #FFF9F6; color: var(--c-primary);
      font-size: 12.5px; font-weight: 600;
    }
    .add-pref svg { width: 14px; height: 14px; }

    /* 弹层分组 */
    .sheet-title { font-size: 17px; font-weight: 700; }
    .sheet-sub { margin-top: 3px; font-size: 11px; color: var(--c-text-ter); }
    .pref-group { margin-bottom: 16px; }
    .pref-group-t { margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--c-text-sub); }

    /* 入口卡 */
    .entry-card { margin: 12px 12px 0; overflow: hidden; }
    .entry-row {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 14px; text-align: left;
    }
    .entry-row + .entry-row { border-top: 1px solid var(--c-border); }
    .entry-row:active { background: #FAFAFB; }
    .entry-ico {
      flex: none; width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: var(--tint, #F4F5F7); color: var(--ink, #555);
    }
    .entry-ico svg { width: 19px; height: 19px; }
    .entry-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .entry-title { font-size: 14.5px; font-weight: 600; }
    .entry-sub { font-size: 11.5px; color: var(--c-text-ter); }
    .entry-chev { flex: none; display: flex; color: #C4C7CC; }
    .entry-chev svg { width: 18px; height: 18px; }

    /* 退出登录 */
    .logout-wrap { margin: 16px 12px 0; }
  </style>
</head>

      <button class="entry-row js-placeholder" type="button" data-toast="MealMind · v0.1 原型 · 模拟数据">

<script src="app.js"></script>
<script>
  (function () {
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    /* ---------- ① 头部：昵称与登录时间 ---------- */
    function fmtLogin(ts) {
      var d = new Date(ts), n = new Date();
      var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
      var sameDay = d.getFullYear() === n.getFullYear() &&
        d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
      return sameDay ? ('今天 ' + hm + ' 登录') : ((d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 登录');
    }
    var session = window.Store ? Store.session : null;
    document.getElementById('profileName').textContent = session ? session.nickname : '未登录';
    document.getElementById('profileSub').textContent = session
      ? (fmtLogin(session.loginAt) + ' · 登录态长期保持')
      : '未登录 · 前往封面页登录';

    /* ---------- ② 偏好记忆（localStorage: mealmind.prefs） ---------- */
    var PREF_KEY = 'mealmind.prefs';
    var DEFAULT_PREFS = ['微辣', '预算 ≤ ¥30', '不吃香菜', '一人食'];
    var GROUPS = [
      { title: '口味', opts: ['微辣', '中辣', '不辣'] },
      { title: '预算', opts: ['≤ ¥20', '≤ ¥30', '≤ ¥50'] },
      { title: '忌口', opts: ['不吃香菜', '不吃花生', '不要葱'] },
      { title: '场景', opts: ['一人食', '多人分享'] }
    ];

    function readPrefs() {
      try {
        var raw = localStorage.getItem(PREF_KEY);
        if (!raw) { localStorage.setItem(PREF_KEY, JSON.stringify(DEFAULT_PREFS)); return DEFAULT_PREFS.slice(); }
        var v = JSON.parse(raw);
        return Array.isArray(v) ? v : DEFAULT_PREFS.slice();
      } catch (e) { return DEFAULT_PREFS.slice(); }
    }
    function writePrefs(list) {
      try { localStorage.setItem(PREF_KEY, JSON.stringify(list)); } catch (e) { /* 忽略 */ }
    }
    /* 归一去重：忽略空白与「预算」前缀，避免与默认项重复 */
    function norm(s) { return String(s).replace(/\s+/g, '').replace(/^预算/, ''); }

    var prefs = readPrefs();
    var chipsEl = document.getElementById('prefChips');

    function renderChips() {
      if (!prefs.length) {
        chipsEl.innerHTML = '<span class="prefs-empty">还没有偏好，点下方添加</span>';
        return;
      }
      chipsEl.innerHTML = prefs.map(function (p, i) {
        return '<button class="chip pref-chip" type="button" data-idx="' + i + '" aria-label="删除偏好 ' + esc(p) + '">' +
          '<span>' + esc(p) + '</span>' + icon('x', 12) + '</button>';
      }).join('');
    }

    chipsEl.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.pref-chip') : null;
      if (!b) return;
      prefs.splice(Number(b.dataset.idx), 1);
      writePrefs(prefs);
      renderChips();
      showToast('已忘记这条偏好');
    });

    /* ---------- 偏好选择弹层 ---------- */
    var mask = document.getElementById('prefMask');
    var sheet = document.getElementById('prefSheet');
    var body = document.getElementById('prefBody');

    function renderSheet() {
      body.innerHTML = GROUPS.map(function (g) {
        return '<div class="pref-group"><div class="pref-group-t">' + esc(g.title) + '</div>' +
          '<div class="opt-row">' + g.opts.map(function (o) {
            return '<button class="opt" type="button" data-opt="' + esc(o) + '">' + esc(o) + '</button>';
          }).join('') + '</div></div>';
      }).join('');
    }
    function openSheet() { renderSheet(); mask.classList.add('show'); sheet.classList.add('show'); }
    function closeSheet() { mask.classList.remove('show'); sheet.classList.remove('show'); }

    document.getElementById('addPrefBtn').addEventListener('click', openSheet);
    document.getElementById('prefClose').addEventListener('click', closeSheet);
    mask.addEventListener('click', closeSheet);

    body.addEventListener('click', function (e) {
      var o = e.target.closest ? e.target.closest('.opt') : null;
      if (o) o.classList.toggle('on');
    });

    document.getElementById('prefSave').addEventListener('click', function () {
      var picked = [].slice.call(body.querySelectorAll('.opt.on')).map(function (o) { return o.dataset.opt; });
      var seen = prefs.map(norm);
      picked.forEach(function (p) {
        if (seen.indexOf(norm(p)) === -1) { prefs.push(p); seen.push(norm(p)); }
      });
      writePrefs(prefs);
      renderChips();
      closeSheet();
      showToast('已记住新的偏好');
    });

    /* ---------- ④ 退出登录 ---------- */
    document.getElementById('logoutBtn').addEventListener('click', function () {
      if (window.Store) Store.logout();
      location.href = 'index.html';
    });

    renderChips();
  })();
</script>
</body>
