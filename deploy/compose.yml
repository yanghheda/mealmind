# MealMind 项目 compose —— 只编排三个应用容器，不含任何存储。
#
# 服务器上的共享基础设施（边缘 nginx / MySQL / Redis）由 /opt/infra 提供，
# 本项目不部署、不重启、不升级它；两者通过外部网络 infra-net 互通。
# 公网唯一入口是基础设施的边缘 nginx，本项目不映射任何宿主机端口。
#
# 生产：镜像由 CI 构建并推送 GHCR，服务器只 pull + up。
#   1. 复制 .env.example 为 .env 并填值（不提交仓库）
#   2. docker compose --env-file deploy/.env -f deploy/compose.yml up -d --wait
#
# 本地：先创建同名外部网络，再叠加 compose.local.yml 用本地源码构建镜像。
#   1. docker network create infra-net   # 仅首次
#   2. cp deploy/.env.example deploy/.env
#   3. docker compose --env-file deploy/.env -f deploy/compose.yml -f deploy/compose.local.yml up -d --build --wait
name: mealmind

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 静态资源容器（nginx:alpine），只接 infra-net，被边缘 nginx 反代。
  mealmind-web:
    image: ${MEALMIND_IMAGE_PREFIX:-ghcr.io/owner/mealmind}-web:${MEALMIND_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [infra-net]

  # 业务服务（Spring Boot :8080）：连共享 MySQL / Redis，对内调 Agent，对外提供 REST 与 SSE。
  mealmind-api:
    image: ${MEALMIND_IMAGE_PREFIX:-ghcr.io/owner/mealmind}-api:${MEALMIND_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/mealmind
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AGENT_BASE_URL: http://mealmind-agent:8000
      INTERNAL_TOKEN: ${MEALMIND_INTERNAL_TOKEN}
      # 与共享 MySQL（SYSTEM = +08）保持同一时钟：幂等窗口等 LocalDateTime 比较依赖它；日志也便于对时
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      mealmind-agent: { condition: service_healthy }
    networks: [infra-net, internal]

  # Agent 运行时（FastAPI :8000）：不接任何存储、不暴露端口；模型密钥只存在于该容器环境变量。
  # 出网：internal 为 internal:true（无公网出口），另接 egress 普通 bridge 网络供模型调用出网。
  mealmind-agent:
    image: ${MEALMIND_IMAGE_PREFIX:-ghcr.io/owner/mealmind}-agent:${MEALMIND_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      INTERNAL_TOKEN: ${MEALMIND_INTERNAL_TOKEN}
      # 与 biz 保持同一时钟（日志对时；agent 不写数据库）
      TZ: Asia/Shanghai
      # 打分通道：AUTO 优先 Jev、失败自动降级规则；RULE 强制规则；JEV 强制 Jev
      # 默认 RULE：Jev 模型已从 TeamoRouter 下线（2026-10-12 确认），暂时固定走规则分（M2 基线）
      SCORER_MODE: ${SCORER_MODE:-RULE}
      # Jev 经 TeamoRouter 调用（技术方案 §2 选型）
      JEV_API_KEY: ${JEV_API_KEY}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.teamorouter.com/v1}
      JEV_MODEL: ${JEV_MODEL:-jev}
      # 出网代理：本地直连不通时用（生产可留空）
      JEV_PROXY_URL: ${JEV_PROXY_URL:-}
      # 生成式模型（理解与表达）：阿里云百炼 qwen3.8
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-max-0902}
      # 降级状态机阈值（技术方案 §6.1）
      DEGRADE_PARTIAL_THRESHOLD: ${DEGRADE_PARTIAL_THRESHOLD:-0.3}
      DEGRADE_COOLDOWN_SECONDS: ${DEGRADE_COOLDOWN_SECONDS:-60}
      # 模型调用超时（秒，技术方案 §6.4）
      UNDERSTAND_TIMEOUT_S: ${UNDERSTAND_TIMEOUT_S:-3}
      PHRASE_TIMEOUT_S: ${PHRASE_TIMEOUT_S:-4}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal, egress]

networks:
  infra-net: { external: true }
  internal: { internal: true }
  # 普通 bridge 网络：只提供公网出网能力（Jev / 生成式大模型调用），不承载任何存储
  egress: {}
