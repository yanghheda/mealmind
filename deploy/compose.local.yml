# 本地开发叠加文件：让 compose 用本地源码构建镜像，而不是拉取 GHCR。
# 生产不使用本文件；服务器上源码不落地，只 pull 镜像。
#
# 用法（在仓库根目录执行）：
#   docker network create infra-net   # 仅首次，模拟服务器上的共享网络
#   cp deploy/.env.example deploy/.env
#   docker compose --env-file deploy/.env -f deploy/compose.yml -f deploy/compose.local.yml up -d --build --wait
services:
  mealmind-web:
    image: mealmind-web:local
    build:
      context: ../apps/h5

  mealmind-api:
    image: mealmind-api:local
    build:
      context: ../services/biz
    environment:
      # 仅本地开发：Jev 经系统 SOCKS 代理比生产直连慢（实测整轮 ~14s），放宽整轮超时便于验证；生产保持默认 12s
      RUN_TIMEOUT_MS: "30000"
    # 仅本地开发：暴露到回环地址，供 h5 dev server 的 /api 代理（vite.config.ts → 127.0.0.1:8080）直连
    ports:
      - "127.0.0.1:8080:8080"

  mealmind-agent:
    image: mealmind-agent:local
    build:
      context: ../services/agent
