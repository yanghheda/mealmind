# /opt/infra/nginx/conf.d/mealmind.yjxai.cloud.conf
# MealMind 站点边缘反代配置（infra 侧资产，随基础设施维护；仓库内保留同源副本）。
# 部署位置：服务器 /opt/infra/nginx/conf.d/，由 infra-nginx 容器只读挂载。
#
# 路由约定（技术方案 §8.2）：
#   /                              → mealmind-web（静态资源；SPA 回退与缓存头在 web 容器内）
#   /api/agent/runs/{runId}/stream → mealmind-api:8080（SSE：必须关缓冲、放宽读超时）
#   /api/                          → mealmind-api:8080（其余接口，前端同源访问，无 CORS）
#
# upstream 用 `resolve` 形式而非直接写域名：边缘 nginx 是全站共用的，普通 upstream
# 在后端容器缺失时会让 `nginx -t`/启动直接失败（host not found in upstream），
# 从而波及其它站点；resolve 形式下本项目容器缺席只是本域名 502，容器起来后 10s 内自动接上。
# 依赖容器内 Docker 内嵌 DNS（127.0.0.11）与 nginx ≥ 1.27.3（线上 1.30.5）。
#
# 放置前提：证书已签发。443 块引用 /etc/letsencrypt/live/mealmind.yjxai.cloud/，
# 证书不存在时 nginx 校验/启动失败。签发前的 ACME 校验请求由现有默认 server 块
# （yjxai.cloud）的 ACME location 承接，可直接用 certbot webroot 模式签发，见
# /opt/infra/README.md 第四节，把 -d 换成 mealmind.yjxai.cloud（不需要 www）。

upstream mealmind_web {
    zone mealmind_web 64k;
    server mealmind-web:80 resolve;
    resolver 127.0.0.11 valid=10s ipv6=off;
    keepalive 16;
}

upstream mealmind_api {
    zone mealmind_api 64k;
    server mealmind-api:8080 resolve;
    resolver 127.0.0.11 valid=10s ipv6=off;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mealmind.yjxai.cloud;

    # Let's Encrypt 域名验证目录（certbot webroot 模式），不能删，HTTPS 启用后也要保留
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mealmind.yjxai.cloud;

    ssl_certificate     /etc/letsencrypt/live/mealmind.yjxai.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mealmind.yjxai.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    charset utf-8;
    client_max_body_size 2m;   # 业务接口只有 JSON 小请求

    # 前端静态资源与 SPA 回退：整体反代给 web 容器（内部 nginx 已做回退与缓存头）
    location / {
        proxy_pass http://mealmind_web;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";   # 清掉默认 close，才能复用 upstream keepalive 连接
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 决策进度流（SSE）：必须关闭缓冲，否则事件攒在 nginx 里不出流；
    # 断线重连携带的 Last-Event-ID 由默认请求头透传，无需额外配置。
    # 正则会先于 /api/ 前缀匹配，故位置不敏感，这里放前面便于阅读。
    location ~ ^/api/agent/runs/[^/]+/stream$ {
        proxy_pass http://mealmind_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余业务接口（登录 / 商家 / 购物车 / 决策快照 / 会话历史等）
    location /api/ {
        proxy_pass http://mealmind_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 隐藏文件与备份文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff2;

    access_log /dev/stdout;
    error_log  /dev/stderr;
}